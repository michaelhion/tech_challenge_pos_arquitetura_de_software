---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: oficina360-api
  namespace: oficina360

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oficina360-api

  minReplicas: 1
  maxReplicas: 2

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70