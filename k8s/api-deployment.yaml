---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: oficina360-api
  namespace: oficina360
  labels:
    app: oficina360-api
    app.kubernetes.io/name: oficina360-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: oficina360

spec:
  replicas: 1

  selector:
    matchLabels:
      app: oficina360-api

  template:
    metadata:
      labels:
        app: oficina360-api
        app.kubernetes.io/name: oficina360-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: oficina360

    spec:
      containers:
        - name: oficina360-api
          image: michaelhion/oficina360:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: oficina360-config
                  key: SPRING_PROFILES_ACTIVE

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: oficina360-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: oficina360-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: oficina360-config
                  key: DB_NAME

            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: oficina360-config
                  key: JWT_ISSUER

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oficina360-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina360-secret
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oficina360-secret
                  key: JWT_SECRET

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
