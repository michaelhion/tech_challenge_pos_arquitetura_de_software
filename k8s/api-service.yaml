---
apiVersion: v1
kind: Service

metadata:
  name: oficina360-api
  namespace: oficina360
  labels:
    app: oficina360-api
    app.kubernetes.io/name: oficina360-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: oficina360

spec:
  type: NodePort

  selector:
    app: oficina360-api

  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
      nodePort: 30080