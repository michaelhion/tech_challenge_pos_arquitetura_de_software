---
name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:

env:
  JAVA_VERSION: "21"
  IMAGE_NAME: oficina360
  KUBERNETES_NAMESPACE: oficina360

jobs:
  # ============================================================
  # 1. SECURITY: OWASP
  # ============================================================

  security:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Setup Java
        uses: actions/setup-java@11d5960a326750d5838078e36cf38b85af677262 #v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # --------------------------------------------------------
      # OWASP cache
      # --------------------------------------------------------

      - name: Get OWASP cache date
        id: cache-date
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore OWASP cache
        id: owasp-cache
        uses: actions/cache/restore@11d5960a326750d5838078e36cf38b85af677262 #v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-owasp-

      - name: Show OWASP cache
        run: |
          echo "Cache hit: ${{ steps.owasp-cache.outputs.cache-hit }}"
          echo "OWASP data directory:"
          du -sh ~/.m2/repository/org/owasp/dependency-check-data 2>/dev/null || true
          find ~/.m2/repository/org/owasp/dependency-check-data \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' 2>/dev/null || true

      # --------------------------------------------------------
      # OWASP scan
      # --------------------------------------------------------

      - name: OWASP Dependency Check
        run: mvn --no-transfer-progress dependency-check:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      # --------------------------------------------------------
      # Save updated OWASP cache
      # --------------------------------------------------------

      - name: Save OWASP cache
        if: success()
        uses: actions/cache/save@11d5960a326750d5838078e36cf38b85af677262 #v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-${{ steps.cache-date.outputs.date }}


  # ============================================================
  # 2. BUILD + TEST + COVERAGE
  # ============================================================

  test:
    name: Build, Tests and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Setup Java
        uses: actions/setup-java@11d5960a326750d5838078e36cf38b85af677262 #v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and test
        run: mvn --no-transfer-progress clean verify

      # --------------------------------------------------------
      # JaCoCo
      # --------------------------------------------------------

      - name: Verify JaCoCo report
        run: |
          echo "JaCoCo report:"
          ls -lh docs/security/jacoco/jacoco.xml

          echo ""
          echo "Report location:"
          find docs/security/jacoco -maxdepth 2 -type f -print

      # --------------------------------------------------------
      # Build artifacts
      # --------------------------------------------------------

      - name: Upload build data
        uses: actions/upload-artifact@11d5960a326750d5838078e36cf38b85af677262 #v4
        with:
          name: build-data
          path: |
            target/*.jar
            target/classes
            docs/security/jacoco/jacoco.xml


  # ============================================================
  # 3. SONARCLOUD
  # ============================================================

  sonar:
    name: SonarCloud
    needs:
      - security
      - test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Setup Java
        uses: actions/setup-java@11d5960a326750d5838078e36cf38b85af677262 #v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # --------------------------------------------------------
      # Restore build generated by test job
      # --------------------------------------------------------

      - name: Download build data
        uses: actions/download-artifact@11d5960a326750d5838078e36cf38b85af677262 #v4
        with:
          name: build-data
          path: .

      # --------------------------------------------------------
      # Verify JaCoCo
      # --------------------------------------------------------

      - name: Verify JaCoCo report
        run: |
          echo "JaCoCo report:"
          find . -name "jacoco.xml" -print

          echo ""
          echo "Classes:"
          find target/classes -type f | head -20

          echo ""
          echo "Report:"
          ls -lh docs/security/jacoco/jacoco.xml

      # --------------------------------------------------------
      # SonarCloud
      # --------------------------------------------------------

      - name: SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn --no-transfer-progress sonar:sonar \
            -Dsonar.projectKey=michaelhion_tech_challenge_pos_arquitetura_de_software \
            -Dsonar.organization=michaelhion \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=docs/security/jacoco/jacoco.xml


  # ============================================================
  # 4. DOCKER
  # ============================================================

  docker:
    name: Build and Push Docker Image
    needs: sonar

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Download build data
        uses: actions/download-artifact@11d5960a326750d5838078e36cf38b85af677262 #v4
        with:
          name: build-data
          path: .

      - name: Verify JAR
        run: |
          ls -lh target/*.jar

      - name: Login to Docker Hub
        uses: docker/login-action@11d5960a326750d5838078e36cf38b85af677262 #v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest