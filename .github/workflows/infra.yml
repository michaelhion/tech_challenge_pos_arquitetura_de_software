---
name: Terraform AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação do Terraform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - deploy
          - destroy

permissions:
  contents: read

concurrency:
  group: oficina360-terraform
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest

    environment:
      name: lab

    env:
      TF_VAR_vpc_id: ${{ vars.TF_VAR_vpc_id }}
      TF_VAR_subnet_id: ${{ vars.TF_VAR_subnet_id }}
      TF_VAR_internet_gateway_id: ${{ vars.TF_VAR_internet_gateway_id }}
      TF_VAR_ssh_allowed_cidr: ${{ vars.TF_VAR_ssh_allowed_cidr }}
      TF_VAR_ami_id: ${{ vars.TF_VAR_ami_id }}

      TF_VAR_project_name: "Oficina360"
      TF_VAR_environment: "lab"
      TF_VAR_instance_type: "t3.micro"
      TF_VAR_key_name: "vockey"
      TF_VAR_api_node_port: "30080"
      TF_VAR_api_allowed_cidr: "0.0.0.0/0"

    defaults:
      run:
        shell: bash
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Terraform Variables
        run: |
          set -Eeuo pipefail

          required_variables=(
            "TF_VAR_vpc_id"
            "TF_VAR_subnet_id"
            "TF_VAR_internet_gateway_id"
            "TF_VAR_ssh_allowed_cidr"
            "TF_VAR_ami_id"
          )

          for variable_name in "${required_variables[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              echo "Variável não configurada: $variable_name"
              exit 1
            fi
          done

          echo "Variáveis Terraform configuradas."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: ${{ inputs.action == 'plan' }}
        run: terraform plan -input=false

      - name: Terraform Plan for Deploy
        if: ${{ inputs.action == 'deploy' }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: ${{ inputs.action == 'deploy' }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show Terraform Outputs
        if: ${{ inputs.action == 'deploy' }}
        run: terraform output

      - name: Terraform Destroy Plan
        if: ${{ inputs.action == 'destroy' }}
        run: terraform plan -destroy -input=false

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -input=false -auto-approve
