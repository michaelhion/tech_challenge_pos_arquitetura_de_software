---
name: AWS Infrastructure and Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação desejada"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - deploy
          - destroy

      image_tag:
        description: "Tag da imagem Docker que será implantada"
        required: true
        default: "latest"
        type: string

concurrency:
  group: oficina360-aws-lab
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  IMAGE_NAME: oficina360
  KUBERNETES_NAMESPACE: oficina360

jobs:
  infrastructure:
    name: Terraform and Kubernetes
    runs-on: ubuntu-latest

    environment:
      name: lab

    env:
      # --------------------------------------------------------
      # Variáveis Terraform configuradas no environment lab
      # --------------------------------------------------------

      TF_VAR_vpc_id: ${{ vars.TF_VAR_vpc_id }}
      TF_VAR_subnet_id: ${{ vars.TF_VAR_subnet_id }}
      TF_VAR_internet_gateway_id: ${{ vars.TF_VAR_internet_gateway_id }}
      TF_VAR_ssh_allowed_cidr: ${{ vars.TF_VAR_ssh_allowed_cidr }}
      TF_VAR_ami_id: ${{ vars.TF_VAR_ami_id }}

      # --------------------------------------------------------
      # Valores fixos do laboratório
      # --------------------------------------------------------

      TF_VAR_instance_type: "t3.micro"
      TF_VAR_key_name: "vockey"
      TF_VAR_project_name: "Oficina360"
      TF_VAR_environment: "lab"
      TF_VAR_api_node_port: "30080"
      TF_VAR_api_allowed_cidr: "0.0.0.0/0"

    steps:
      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================================
      # VALIDATE CONFIGURATION
      # ========================================================

      - name: Validate Terraform variables
        shell: bash
        run: |
          set -Eeuo pipefail

          required_variables=(
            "TF_VAR_vpc_id"
            "TF_VAR_subnet_id"
            "TF_VAR_internet_gateway_id"
            "TF_VAR_ssh_allowed_cidr"
            "TF_VAR_ami_id"
          )

          missing=0

          for variable_name in "${required_variables[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              echo "Variável não configurada: $variable_name"
              missing=1
            else
              echo "Variável configurada: $variable_name"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Configure as variáveis ausentes em:"
            echo "Settings > Environments > lab > Environment variables"
            exit 1
          fi

          echo ""
          echo "Todas as variáveis obrigatórias estão configuradas."

      - name: Validate AWS credentials configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID_VALUE: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_VALUE: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN_VALUE: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -Eeuo pipefail

          missing=0

          if [ -z "$AWS_ACCESS_KEY_ID_VALUE" ]; then
            echo "Secret não configurado: AWS_ACCESS_KEY_ID"
            missing=1
          fi

          if [ -z "$AWS_SECRET_ACCESS_KEY_VALUE" ]; then
            echo "Secret não configurado: AWS_SECRET_ACCESS_KEY"
            missing=1
          fi

          if [ -z "$AWS_SESSION_TOKEN_VALUE" ]; then
            echo "Secret não configurado: AWS_SESSION_TOKEN"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Configure os Secrets AWS no environment lab."
            exit 1
          fi

          echo "Os três Secrets AWS estão configurados."

      - name: Validate deployment secrets
        if: inputs.action == 'deploy'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -Eeuo pipefail

          required_variables=(
            "SSH_PRIVATE_KEY"
            "DB_USERNAME"
            "DB_PASSWORD"
            "JWT_SECRET"
            "DOCKERHUB_USERNAME"
          )

          missing=0

          for variable_name in "${required_variables[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              echo "Secret não configurado: $variable_name"
              missing=1
            else
              echo "Secret configurado: $variable_name"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Configure os Secrets de deploy no environment lab."
            exit 1
          fi

          echo ""
          echo "Todos os Secrets de deploy estão configurados."

      # ========================================================
      # AWS
      # ========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS identity
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Identidade AWS utilizada pelo workflow:"
          aws sts get-caller-identity

      # ========================================================
      # TERRAFORM
      # ========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform format
        shell: bash
        run: |
          set -Eeuo pipefail

          terraform -chdir=infra fmt -check -recursive

      - name: Terraform init
        shell: bash
        run: |
          set -Eeuo pipefail

          terraform -chdir=infra init \
            -input=false

      - name: Terraform validate
        shell: bash
        run: |
          set -Eeuo pipefail

          terraform -chdir=infra validate

      # --------------------------------------------------------
      # PLAN
      # --------------------------------------------------------

      - name: Terraform plan
        if: inputs.action != 'destroy'
        shell: bash
        run: |
          set -Eeuo pipefail

          terraform -chdir=infra plan \
            -input=false \
            -out=tfplan

      - name: Terraform plan summary
        if: inputs.action == 'plan'
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo " Terraform plan concluído"
          echo "======================================"
          echo ""
          echo "Nenhum recurso foi alterado."
          echo "Execute novamente selecionando deploy para aplicar o plano."

      # --------------------------------------------------------
      # APPLY
      # --------------------------------------------------------

      - name: Terraform apply
        if: inputs.action == 'deploy'
        shell: bash
        run: |
          set -Eeuo pipefail

          terraform -chdir=infra apply \
            -input=false \
            -auto-approve \
            tfplan

      - name: Export EC2 public IP
        if: inputs.action == 'deploy'
        id: terraform-output
        shell: bash
        run: |
          set -Eeuo pipefail

          PUBLIC_IP="$(
            terraform -chdir=infra output -raw public_ip
          )"

          if [ -z "$PUBLIC_IP" ]; then
            echo "Terraform não retornou o IP público."
            exit 1
          fi

          if [[ ! "$PUBLIC_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Terraform retornou um IP público inválido."
            exit 1
          fi

          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "EC2 provisionada."
          echo "IP público: $PUBLIC_IP"

      # ========================================================
      # SSH
      # ========================================================

      - name: Configure SSH key
        if: inputs.action == 'deploy'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/labsuser.pem"

          chmod 600 "$HOME/.ssh/labsuser.pem"

          if ! ssh-keygen \
            -y \
            -f "$HOME/.ssh/labsuser.pem" \
            >/dev/null; then

            echo "EC2_SSH_PRIVATE_KEY não contém uma chave privada válida."
            exit 1
          fi

          echo "Chave SSH configurada."

      - name: Wait for EC2 SSH
        if: inputs.action == 'deploy