name: Deploy Kubernetes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oficina360-kubernetes
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_NAME: Oficina360-k3s
  KUBERNETES_NAMESPACE: oficina360

jobs:
  deploy:
    name: Deploy Oficina360
    runs-on: ubuntu-latest

    environment:
      name: lab

    defaults:
      run:
        shell: bash

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Configurar AWS
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------
      # 3. Validar credenciais AWS
      # ------------------------------------------------------------
      - name: Validate AWS credentials
        run: |
          set -Eeuo pipefail

          aws sts get-caller-identity >/dev/null

          echo "Credenciais AWS validadas."

      # ------------------------------------------------------------
      # 4. Validar arquivos do deploy
      # ------------------------------------------------------------
      - name: Validate deployment files
        run: |
          set -Eeuo pipefail

          K8S_DIR="k8s"

          required_files=(
            "$K8S_DIR/deploy.sh"
            "$K8S_DIR/1-namespace.yaml"
            "$K8S_DIR/3-configmap.yaml"
            "$K8S_DIR/5-postgres-pvc.yaml"
            "$K8S_DIR/6-postgres-service.yaml"
            "$K8S_DIR/7-postgres-deployment.yaml"
            "$K8S_DIR/8-api-deployment.yaml"
            "$K8S_DIR/9-api-service.yaml"
            "$K8S_DIR/10-hpa.yaml"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Arquivo não encontrado: $file"
              exit 1
            fi
          done

          chmod +x "$K8S_DIR/deploy.sh"

          if [[ -f "$K8S_DIR/validate.sh" ]]; then
            chmod +x "$K8S_DIR/validate.sh"
          fi

          echo "Arquivos de deploy encontrados."

      # ------------------------------------------------------------
      # 5. Validar Secrets
      # ------------------------------------------------------------
      - name: Validate deployment secrets
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -Eeuo pipefail

          [[ -n "$DB_USERNAME" ]] || {
            echo "::error::DB_USERNAME não configurado."
            exit 1
          }

          [[ -n "$DB_PASSWORD" ]] || {
            echo "::error::DB_PASSWORD não configurado."
            exit 1
          }

          [[ -n "$JWT_SECRET" ]] || {
            echo "::error::JWT_SECRET não configurado."
            exit 1
          }

          echo "Secrets obrigatórios configurados."

      # ------------------------------------------------------------
      # 6. Validar manifests localmente
      # ------------------------------------------------------------
      #
      # Não precisamos de kubectl no runner.
      # A validação completa já é feita pelo deploy.sh na EC2,
      # onde existe acesso ao cluster.
      #
      # Aqui fazemos apenas uma validação estrutural simples.
      # ------------------------------------------------------------
      - name: Validate Kubernetes manifest files
        run: |
          set -Eeuo pipefail

          for file in k8s/*.yaml; do
            echo "Encontrado: $file"
          done

          echo "Estrutura de manifests validada."

      # ------------------------------------------------------------
      # 7. Localizar EC2
      # ------------------------------------------------------------
      - name: Locate EC2 instance
        id: ec2
        run: |
          set -Eeuo pipefail

          INSTANCE_IDS="$(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:Name,Values=${EC2_INSTANCE_NAME}" \
                "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text
          )"

          if [[ -z "$INSTANCE_IDS" || "$INSTANCE_IDS" == "None" ]]; then
            echo "::error::Nenhuma EC2 encontrada com Name=${EC2_INSTANCE_NAME}"
            exit 1
          fi

          read -r -a INSTANCES <<< "$INSTANCE_IDS"

          if [[ "${#INSTANCES[@]}" -ne 1 ]]; then
            echo "::error::Esperada exatamente uma EC2."
            echo "Encontradas: ${#INSTANCES[@]}"
            echo "IDs: $INSTANCE_IDS"
            exit 1
          fi

          INSTANCE_ID="${INSTANCES[0]}"

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

          echo "EC2 encontrada: $INSTANCE_ID"

      # ------------------------------------------------------------
      # 8. Aguardar SSM
      # ------------------------------------------------------------
      - name: Wait for SSM
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 30); do

            STATUS="$(
              aws ssm describe-instance-information \
                --region "$AWS_REGION" \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text \
                2>/dev/null || true
            )"

            if [[ "$STATUS" == "Online" ]]; then
              echo "EC2 está Online no Systems Manager."
              exit 0
            fi

            echo "Tentativa ${attempt}/30 - SSM: ${STATUS:-unknown}"

            sleep 10
          done

          echo "::error::EC2 não ficou disponível no SSM."
          exit 1

      # ------------------------------------------------------------
      # 9. Criar Secret temporário
      # ------------------------------------------------------------
      - name: Create temporary Kubernetes Secret
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -Eeuo pipefail

          rm -rf .deploy
          mkdir -p .deploy/k8s

          deployment_files=(
            "k8s/1-namespace.yaml"
            "k8s/3-configmap.yaml"
            "k8s/5-postgres-pvc.yaml"
            "k8s/6-postgres-service.yaml"
            "k8s/7-postgres-deployment.yaml"
            "k8s/8-api-deployment.yaml"
            "k8s/9-api-service.yaml"
            "k8s/10-hpa.yaml"
            "k8s/deploy.sh"
          )

          cp \
            "${deployment_files[@]}" \
            .deploy/k8s/

          if [[ -f k8s/validate.sh ]]; then
            cp k8s/validate.sh .deploy/k8s/
            chmod +x .deploy/k8s/validate.sh
          fi

          DB_USERNAME_BASE64="$(
            printf '%s' "$DB_USERNAME" |
              base64 -w 0
          )"

          DB_PASSWORD_BASE64="$(
            printf '%s' "$DB_PASSWORD" |
              base64 -w 0
          )"

          JWT_SECRET_BASE64="$(
            printf '%s' "$JWT_SECRET" |
              base64 -w 0
          )"

          cat > .deploy/k8s/secret.yaml <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: oficina360-secret
            namespace: oficina360
          type: Opaque
          data:
            DB_USERNAME: ${DB_USERNAME_BASE64}
            DB_PASSWORD: ${DB_PASSWORD_BASE64}
            JWT_SECRET: ${JWT_SECRET_BASE64}
          EOF

          chmod 600 .deploy/k8s/secret.yaml
          chmod +x .deploy/k8s/deploy.sh

          echo "Arquivos incluídos no pacote:"

          find .deploy/k8s \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

          if find .deploy/k8s \
            -maxdepth 1 \
            -type f \
            -name '*metrics-server*' |
            grep -q .; then

            echo "::error::O Metrics Server não deve entrar no pacote."
            exit 1
          fi

          if [[ -f .deploy/k8s/secret-example.yaml ]]; then
            echo "::error::secret-example.yaml não deve entrar no pacote."
            exit 1
          fi

          echo "Pacote de deploy preparado."

      # ------------------------------------------------------------
      # 10. Compactar pacote
      # ------------------------------------------------------------
      - name: Package deployment
        run: |
          set -Eeuo pipefail

          tar \
            -C .deploy \
            -czf /tmp/oficina360-deploy.tar.gz \
            k8s

          echo "Pacote:"
          ls -lh /tmp/oficina360-deploy.tar.gz

      # ------------------------------------------------------------
      # 11. Converter pacote para Base64
      # ------------------------------------------------------------
      - name: Encode deployment package
        run: |
          set -Eeuo pipefail

          base64 \
            -w 0 \
            /tmp/oficina360-deploy.tar.gz \
            > /tmp/oficina360-deploy.base64

          SIZE="$(
            stat -c '%s' /tmp/oficina360-deploy.base64
          )"

          echo "Pacote Base64: ${SIZE} bytes"

          if [[ "$SIZE" -gt 60000 ]]; then
            echo "::error::Pacote excedeu 60 KB."
            echo "Considere utilizar S3 para transportar o artefato."
            exit 1
          fi

      # ------------------------------------------------------------
      # 12. Gerar parâmetros do SSM
      # ------------------------------------------------------------
      - name: Prepare SSM command
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          set -Eeuo pipefail

          PACKAGE="$(
            cat /tmp/oficina360-deploy.base64
          )"

          python3 - "$PACKAGE" > /tmp/ssm-parameters.json <<'PY'
          import json
          import sys

          package = sys.argv[1]

          commands = [
              "set -Eeuo pipefail",

              "rm -rf /tmp/oficina360-deploy",
              "mkdir -p /tmp/oficina360-deploy",

              (
                  "printf '%s' '" + package +
                  "' | base64 -d > "
                  "/tmp/oficina360-deploy/package.tar.gz"
              ),

              "tar -xzf /tmp/oficina360-deploy/package.tar.gz "
              "-C /tmp/oficina360-deploy",

              "rm -f /tmp/oficina360-deploy/package.tar.gz",

              "chmod +x /tmp/oficina360-deploy/k8s/deploy.sh",

              "cd /tmp/oficina360-deploy/k8s",

              "./deploy.sh",

              "rm -rf /tmp/oficina360-deploy"
          ]

          print(json.dumps({
              "commands": commands
          }))
          PY

          echo "Parâmetros SSM preparados."

      # ------------------------------------------------------------
      # 13. Executar deploy na EC2
      # ------------------------------------------------------------
      - name: Execute deployment through SSM
        id: deploy
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          set -Eeuo pipefail

          COMMAND_ID="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Oficina360 Kubernetes deployment" \
              --parameters file:///tmp/ssm-parameters.json \
              --timeout-seconds 1200 \
              --query 'Command.CommandId' \
              --output text
          )"

          if [[ -z "$COMMAND_ID" || "$COMMAND_ID" == "None" ]]; then
            echo "::error::SSM não retornou Command ID."
            exit 1
          fi

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          echo "SSM Command ID: $COMMAND_ID"

      # ------------------------------------------------------------
      # 14. Aguardar deploy
      # ------------------------------------------------------------
      - name: Wait for deployment
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 120); do

            STATUS="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'Status' \
                --output text \
                2>/dev/null || true
            )"

            echo "Tentativa ${attempt}/120 - Status: ${STATUS:-unknown}"

            case "$STATUS" in

              Success)
                echo ""
                echo "======================================"
                echo " Deploy concluído com sucesso"
                echo "======================================"
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo ""
                echo "::error::Deploy terminou com status: $STATUS"
                exit 1
                ;;

              Pending|InProgress|Delayed|"")
                sleep 10
                ;;

              *)
                echo "Status desconhecido: $STATUS"
                sleep 10
                ;;

            esac

          done

          echo "::error::Timeout aguardando execução do deploy."
          exit 1

      # ------------------------------------------------------------
      # 15. Mostrar logs mesmo em caso de falha
      # ------------------------------------------------------------
      - name: Show deployment output
        if: always() && steps.deploy.outputs.command_id != ''
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -Eeuo pipefail

          echo ""
          echo "======================================"
          echo " Saída do deploy"
          echo "======================================"

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text \
            2>/dev/null || true

          echo ""
          echo "======================================"
          echo " Erros do deploy"
          echo "======================================"

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' \
            --output text \
            2>/dev/null || true

      # ------------------------------------------------------------
      # 16. Limpeza local
      # ------------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          rm -rf .deploy
          rm -f \
            /tmp/oficina360-deploy.tar.gz \
            /tmp/oficina360-deploy.base64 \
            /tmp/ssm-parameters.json