---
name: Kubernetes Manifests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oficina360-kubernetes
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_NAME: Oficina360-k3s
  KUBERNETES_NAMESPACE: oficina360

jobs:
  deploy:
    name: Apply Kubernetes Manifests
    runs-on: ubuntu-latest

    environment:
      name: lab

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS Credentials
        run: |
          set -Eeuo pipefail

          aws sts get-caller-identity >/dev/null

          echo "Credenciais AWS validadas."

      - name: Locate EC2 Instance
        id: ec2
        run: |
          set -Eeuo pipefail

          INSTANCE_IDS="$(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:Name,Values=${EC2_INSTANCE_NAME}" \
                "Name=instance-state-name,Values=pending,running" \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text
          )"

          if [ -z "$INSTANCE_IDS" ] ||
             [ "$INSTANCE_IDS" = "None" ]; then

            echo "Nenhuma EC2 do projeto foi encontrada."
            exit 1
          fi

          INSTANCE_COUNT="$(
            wc -w <<< "$INSTANCE_IDS"
          )"

          if [ "$INSTANCE_COUNT" -ne 1 ]; then
            echo "Foi encontrada uma quantidade inesperada de instâncias."
            exit 1
          fi

          INSTANCE_ID="$INSTANCE_IDS"

          aws ec2 wait instance-running \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID"

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

          echo "EC2 localizada e em execução."

      - name: Wait for SSM
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 30); do
            STATUS="$(
              aws ssm describe-instance-information \
                --region "$AWS_REGION" \
                --filters \
                  "Key=InstanceIds,Values=${INSTANCE_ID}" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text \
                2>/dev/null || true
            )"

            if [ "$STATUS" = "Online" ]; then
              echo "EC2 disponível no Systems Manager."
              exit 0
            fi

            echo "Tentativa ${attempt}/30: aguardando Systems Manager..."
            sleep 10
          done

          echo "A EC2 não ficou disponível no Systems Manager."
          echo "Verifique o LabInstanceProfile e o amazon-ssm-agent."
          exit 1

      - name: Validate Kubernetes Files
        run: |
          set -Eeuo pipefail

          required_files=(
            "k8s/1-namespace.yaml"
            "k8s/3-configmap.yaml"
            "k8s/5-postgres-pvc.yaml"
            "k8s/6-postgres-service.yaml"
            "k8s/7-postgres-deployment.yaml"
            "k8s/8-api-deployment.yaml"
            "k8s/9-api-service.yaml"
            "k8s/10-hpa.yaml"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Manifesto obrigatório não encontrado: $file"
              exit 1
            fi

            echo "Manifesto encontrado: $file"
          done

          if ! grep -Eq \
            '^[[:space:]]*kind:[[:space:]]*Namespace[[:space:]]*$' \
            k8s/1-namespace.yaml; then

            echo "O arquivo 1-namespace.yaml não declara um Namespace."
            exit 1
          fi

          if ! grep -Eq \
            '^[[:space:]]*name:[[:space:]]*oficina360[[:space:]]*$' \
            k8s/1-namespace.yaml; then

            echo "O Namespace oficina360 não foi encontrado."
            exit 1
          fi

          echo "Todos os manifests foram encontrados."
          
      - name: Validate Kubernetes Secrets
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -Eeuo pipefail

          required_secrets=(
            "DB_USERNAME"
            "DB_PASSWORD"
            "JWT_SECRET"
          )

          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Secret obrigatório não configurado: $secret_name"
              exit 1
            fi
          done

          echo "Secrets obrigatórios configurados."

      - name: Package Kubernetes Manifests
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -Eeuo pipefail

          required_files=(
            "k8s/1-namespace.yaml"
            "k8s/3-configmap.yaml"
            "k8s/5-postgres-pvc.yaml"
            "k8s/6-postgres-service.yaml"
            "k8s/7-postgres-deployment.yaml"
            "k8s/8-api-deployment.yaml"
            "k8s/9-api-service.yaml"
            "k8s/10-hpa.yaml"
          )

          rm -rf /tmp/oficina360-package

          rm -f \
            /tmp/oficina360-k8s.tar.gz \
            /tmp/oficina360-k8s.base64 \
            /tmp/ssm-parameters.json

          mkdir -p /tmp/oficina360-package/k8s

          cp \
            "${required_files[@]}" \
            /tmp/oficina360-package/k8s/

          DB_USERNAME_BASE64="$(
            printf '%s' "$DB_USERNAME" |
              base64 -w 0
          )"

          DB_PASSWORD_BASE64="$(
            printf '%s' "$DB_PASSWORD" |
              base64 -w 0
          )"

          JWT_SECRET_BASE64="$(
            printf '%s' "$JWT_SECRET" |
              base64 -w 0
          )"

          cat > /tmp/oficina360-package/k8s/2-secret.generated.yaml <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: oficina360-secret
            namespace: oficina360
          type: Opaque
          data:
            DB_USERNAME: ${DB_USERNAME_BASE64}
            DB_PASSWORD: ${DB_PASSWORD_BASE64}
            JWT_SECRET: ${JWT_SECRET_BASE64}
          EOF

          chmod 600 \
            /tmp/oficina360-package/k8s/2-secret.generated.yaml

          echo "Manifestos preparados para envio:"

          find /tmp/oficina360-package/k8s \
            -maxdepth 1 \
            -type f \
            -name '*.yaml' \
            -printf '%f\n' |
            sort

          tar \
            -C /tmp/oficina360-package \
            -czf /tmp/oficina360-k8s.tar.gz \
            k8s

          base64 \
            -w 0 \
            /tmp/oficina360-k8s.tar.gz \
            > /tmp/oficina360-k8s.base64

          ARCHIVE_SIZE="$(
            stat -c '%s' /tmp/oficina360-k8s.tar.gz
          )"

          BASE64_SIZE="$(
            stat -c '%s' /tmp/oficina360-k8s.base64
          )"

          if [ ! -s /tmp/oficina360-k8s.base64 ]; then
            echo "O pacote Base64 está vazio."
            exit 1
          fi

          if [ "$BASE64_SIZE" -gt 24000 ]; then
            echo "O pacote ficou maior que o limite definido."
            echo "Tamanho atual: ${BASE64_SIZE} bytes."
            exit 1
          fi

          echo "Pacote criado com sucesso."
          echo "Tamanho compactado: ${ARCHIVE_SIZE} bytes."
          echo "Tamanho para transporte: ${BASE64_SIZE} bytes."

      - name: Send Manifests with SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          set -Eeuo pipefail

          if [ ! -s /tmp/oficina360-k8s.base64 ]; then
            echo "O pacote de manifests não foi encontrado."
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path("/tmp/oficina360-k8s.base64")
          parameters_path = Path("/tmp/ssm-parameters.json")

          package = package_path.read_text(
              encoding="utf-8"
          ).strip()

          if not package:
              raise SystemExit(
                  "O pacote Base64 está vazio."
              )

          commands = [
              "set -Eeuo pipefail",

              "rm -rf /tmp/oficina360",

              "mkdir -p /tmp/oficina360",

              (
                  "printf '%s' '"
                  + package
                  + "' | base64 -d "
                  "> /tmp/oficina360/k8s.tar.gz"
              ),

              (
                  "chmod 600 "
                  "/tmp/oficina360/k8s.tar.gz"
              ),

              (
                  "tar -xzf "
                  "/tmp/oficina360/k8s.tar.gz "
                  "-C /tmp/oficina360"
              ),

              (
                  "rm -f "
                  "/tmp/oficina360/k8s.tar.gz"
              ),

              "echo 'Aguardando K3s...'",

              (
                  "for attempt in $(seq 1 60); do "
                  "if sudo timeout 15 "
                  "k3s kubectl get nodes "
                  ">/dev/null 2>&1; then "
                  "echo 'K3s disponível'; "
                  "break; "
                  "fi; "
                  "if [ \"$attempt\" -eq 60 ]; then "
                  "echo 'K3s indisponível'; "
                  "exit 1; "
                  "fi; "
                  "sleep 10; "
                  "done"
              ),

              "echo 'Aplicando Namespace...'",

              (
                  "sudo k3s kubectl apply "
                  "--filename "
                  "/tmp/oficina360/k8s/"
                  "1-namespace.yaml"
              ),

              (
                  "sudo k3s kubectl get namespace "
                  "oficina360"
              ),

              "echo 'Aplicando Secret...'",

              (
                  "sudo k3s kubectl apply "
                  "--filename "
                  "/tmp/oficina360/k8s/"
                  "2-secret.generated.yaml"
              ),

              (
                  "rm -f "
                  "/tmp/oficina360/k8s/"
                  "2-secret.generated.yaml"
              ),

              "echo 'Aplicando ConfigMap...'",

              (
                  "sudo k3s kubectl apply "
                  "--filename "
                  "/tmp/oficina360/k8s/"
                  "3-configmap.yaml"
              ),

              "echo 'Aplicando PVC do PostgreSQL...'",

              (
                  "sudo k3s kubectl apply "
                  "--filename "
                  "/tmp/oficina360/k8s/"
                  "5-postgres-pvc.yaml"
              ),

              "echo 'Aplicando Service do PostgreSQL...'",

              (
                  "sudo k3s kubectl apply "
                  "--filename "
                  "/tmp/oficina360/k8s/"
                  "6-postgres-service.yaml"
              ),

              "echo 'Aplicando Deployment do PostgreSQL...'",

              (
                  "sudo k3s kubectl apply "
                  "--filename "
                  "/tmp/oficina360/k8s/"
                  "7-postgres-deployment.yaml"
              ),

              "echo 'Aguardando PostgreSQL...'",

              (
                  "sudo k3s kubectl rollout status "
                  "deployment/postgres "
                  "--namespace oficina360 "
                  "--timeout=300s"
              ),

              "echo 'Aplicando Deployment da API...'",

              (
                  "sudo k3s kubectl apply "
                  "--filename "
                  "/tmp/oficina360/k8s/"
                  "8-api-deployment.yaml"
              ),

              "echo 'Aplicando Service da API...'",

              (
                  "sudo k3s kubectl apply "
                  "--filename "
                  "/tmp/oficina360/k8s/"
                  "9-api-service.yaml"
              ),

              "echo 'Aguardando API...'",

              (
                  "sudo k3s kubectl rollout status "
                  "deployment/oficina360-api "
                  "--namespace oficina360 "
                  "--timeout=600s"
              ),

              "echo 'Aplicando HPA...'",

              (
                  "sudo k3s kubectl apply "
                  "--filename "
                  "/tmp/oficina360/k8s/"
                  "10-hpa.yaml"
              ),

              "echo 'Consultando Pods...'",

              (
                  "sudo k3s kubectl get pods "
                  "--namespace oficina360"
              ),

              "echo 'Consultando Services...'",

              (
                  "sudo k3s kubectl get services "
                  "--namespace oficina360"
              ),

              "echo 'Consultando PVC...'",

              (
                  "sudo k3s kubectl get pvc "
                  "--namespace oficina360"
              ),

              "echo 'Consultando HPA...'",

              (
                  "sudo k3s kubectl get hpa "
                  "--namespace oficina360"
              ),

              "rm -rf /tmp/oficina360",

              (
                  "echo "
                  "'Deploy Kubernetes concluído com sucesso'"
              ),
          ]

          parameters_path.write_text(
              json.dumps(
                  {"commands": commands},
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY

          if [ ! -s /tmp/ssm-parameters.json ]; then
            echo "Não foi possível gerar os parâmetros do SSM."
            exit 1
          fi

          COMMAND_ID="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy Kubernetes Oficina360" \
              --parameters file:///tmp/ssm-parameters.json \
              --timeout-seconds 1200 \
              --query 'Command.CommandId' \
              --output text
          )"

          if [ -z "$COMMAND_ID" ] ||
             [ "$COMMAND_ID" = "None" ]; then

            echo "O Systems Manager não retornou um Command ID."
            exit 1
          fi

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          rm -f \
            /tmp/ssm-parameters.json \
            /tmp/oficina360-k8s.base64 \
            /tmp/oficina360-k8s.tar.gz

          rm -rf /tmp/oficina360-package

          echo "Manifestos enviados para execução."

      - name: Wait for Manifest Execution
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -Eeuo pipefail

          FINAL_STATUS=""

          for attempt in $(seq 1 100); do
            STATUS="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'Status' \
                --output text \
                2>/dev/null || true
            )"

            case "$STATUS" in
              Success)
                FINAL_STATUS="$STATUS"
                echo "Execução concluída com sucesso."
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                FINAL_STATUS="$STATUS"
                echo "A execução terminou com falha."
                break
                ;;

              Pending|InProgress|Delayed|"")
                echo "Tentativa ${attempt}/100: execução em andamento..."
                sleep 10
                ;;

              *)
                echo "Tentativa ${attempt}/100: aguardando resultado..."
                sleep 10
                ;;
            esac
          done

          if [ -z "$FINAL_STATUS" ]; then
            FINAL_STATUS="TimedOut"
          fi

          echo "Status final: $FINAL_STATUS"

          echo ""
          echo "=== Saída sanitizada ==="

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text \
            2>/dev/null \
            | sed -E \
                -e 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/[EMAIL_REMOVIDO]/g' \
                -e 's/[0-9]{12}/[CONTA_AWS_REMOVIDA]/g' \
                -e 's/i-[0-9a-f]{8,17}/[INSTANCE_ID_REMOVIDO]/g' \
            || true

          if [ "$FINAL_STATUS" != "Success" ]; then
            echo ""
            echo "=== Erros sanitizados ==="

            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' \
              --output text \
              2>/dev/null \
              | sed -E \
                  -e 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/[EMAIL_REMOVIDO]/g' \
                  -e 's/[0-9]{12}/[CONTA_AWS_REMOVIDA]/g' \
                  -e 's/i-[0-9a-f]{8,17}/[INSTANCE_ID_REMOVIDO]/g' \
              || true

            exit 1
          fi

          echo ""
          echo "Teste mínimo do Kubernetes finalizado."