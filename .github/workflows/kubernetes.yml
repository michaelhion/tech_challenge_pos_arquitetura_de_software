---
name: Kubernetes Manifests Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oficina360-kubernetes-test
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_NAME: Oficina360-k3s
  KUBERNETES_NAMESPACE: oficina360

jobs:
  deploy:
    name: Apply Kubernetes Manifests
    runs-on: ubuntu-latest

    environment:
      name: lab

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS Credentials
        run: |
          set -Eeuo pipefail

          aws sts get-caller-identity >/dev/null

          echo "Credenciais AWS validadas."

      - name: Locate EC2 Instance
        id: ec2
        run: |
          set -Eeuo pipefail

          INSTANCE_IDS="$(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:Name,Values=${EC2_INSTANCE_NAME}" \
                "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text
          )"

          if [ -z "$INSTANCE_IDS" ] ||
             [ "$INSTANCE_IDS" = "None" ]; then

            echo "Nenhuma EC2 em execução foi encontrada."
            exit 1
          fi

          INSTANCE_COUNT="$(
            wc -w <<< "$INSTANCE_IDS"
          )"

          if [ "$INSTANCE_COUNT" -ne 1 ]; then
            echo "Foi encontrada uma quantidade inesperada de instâncias."
            exit 1
          fi

          INSTANCE_ID="$INSTANCE_IDS"

          echo "::add-mask::$INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

          echo "EC2 localizada."

      - name: Wait for SSM
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 30); do
            STATUS="$(
              aws ssm describe-instance-information \
                --region "$AWS_REGION" \
                --filters \
                  "Key=InstanceIds,Values=${INSTANCE_ID}" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text \
                2>/dev/null || true
            )"

            if [ "$STATUS" = "Online" ]; then
              echo "EC2 disponível no Systems Manager."
              exit 0
            fi

            echo "Tentativa ${attempt}/30: aguardando SSM..."
            sleep 10
          done

          echo "A EC2 não ficou disponível no Systems Manager."
          exit 1

      - name: Validate Kubernetes Files
        run: |
          set -Eeuo pipefail

          required_files=(
            "k8s/1-namespace.yaml"
            "k8s/3-configmap.yaml"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Manifesto obrigatório não encontrado: $file"
              exit 1
            fi

            echo "Manifesto encontrado: $file"
          done

      - name: Package Kubernetes Manifests
        run: |
          set -Eeuo pipefail

          required_files=(
            "k8s/1-namespace.yaml"
            "k8s/3-configmap.yaml"
          )

          rm -rf /tmp/oficina360-package

          mkdir -p \
            /tmp/oficina360-package/k8s

          cp \
            "${required_files[@]}" \
            /tmp/oficina360-package/k8s/

          echo "=== Arquivos selecionados ==="

          find /tmp/oficina360-package/k8s \
            -maxdepth 1 \
            -type f \
            -name '*.yaml' \
            -printf '%f\n' \
            | sort

          tar \
            -C /tmp/oficina360-package \
            -czf /tmp/oficina360-k8s.tar.gz \
            k8s

          base64 \
            -w 0 \
            /tmp/oficina360-k8s.tar.gz \
            > /tmp/oficina360-k8s.base64

          BASE64_SIZE="$(
            stat -c '%s' /tmp/oficina360-k8s.base64
          )"

          if [ ! -s /tmp/oficina360-k8s.base64 ]; then
            echo "O pacote Base64 está vazio."
            exit 1
          fi

          if [ "$BASE64_SIZE" -gt 20000 ]; then
            echo "O pacote ficou maior que 20 KB."
            echo "Tamanho atual: ${BASE64_SIZE} bytes."
            exit 1
          fi

          echo "Pacote criado com sucesso."
          echo "Manifestos incluídos: ${#required_files[@]}"
          echo "Tamanho para envio: ${BASE64_SIZE} bytes."

      - name: Send Manifests with SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          set -Eeuo pipefail

          MANIFESTS_BASE64="$(
            cat /tmp/oficina360-k8s.base64
          )"

          echo "::add-mask::$MANIFESTS_BASE64"

          jq -n \
            --arg package "$MANIFESTS_BASE64" \
            --arg namespace "$KUBERNETES_NAMESPACE" \
            '{
              commands: [
                "set -Eeuo pipefail",

                "rm -rf /tmp/oficina360",
                "mkdir -p /tmp/oficina360",

                (
                  "printf %s "
                  + ($package | @sh)
                  + " | base64 -d > /tmp/oficina360/k8s.tar.gz"
                ),

                "chmod 600 /tmp/oficina360/k8s.tar.gz",

                "tar -xzf /tmp/oficina360/k8s.tar.gz -C /tmp/oficina360",

                "rm -f /tmp/oficina360/k8s.tar.gz",

                "echo === Aguardando K3s ===",

                "for attempt in $(seq 1 60); do if sudo timeout 15 k3s kubectl get nodes >/dev/null 2>&1; then echo K3s disponível; break; fi; if [ $attempt -eq 60 ]; then echo K3s indisponível; exit 1; fi; sleep 10; done",

                "echo === Criando namespace ===",

                "sudo k3s kubectl apply --filename /tmp/oficina360/k8s/1-namespace.yaml",

                (
                  "sudo k3s