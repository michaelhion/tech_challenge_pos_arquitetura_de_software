---
name: Kubernetes Deploy with SSM

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação Kubernetes"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - status
          - remove

      image_tag:
        description: "Tag da imagem Docker"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read

concurrency:
  group: oficina360-kubernetes
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_NAME: Oficina360-k3s
  KUBERNETES_NAMESPACE: oficina360
  IMAGE_NAME: oficina360

jobs:
  kubernetes:
    name: Kubernetes ${{ inputs.action }}
    runs-on: ubuntu-latest

    environment:
      name: lab

    defaults:
      run:
        shell: bash

    steps:
      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================================
      # AWS
      # ========================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS Identity
        run: aws sts get-caller-identity

      # ========================================================
      # LOCATE EC2
      # ========================================================

      - name: Locate EC2 Instance
        id: ec2
        run: |
          set -Eeuo pipefail

          INSTANCE_ID="$(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:Name,Values=${EC2_INSTANCE_NAME}" \
                "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text
          )"

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Nenhuma EC2 em execução foi encontrada."
            echo "Tag esperada: Name=${EC2_INSTANCE_NAME}"
            exit 1
          fi

          INSTANCE_COUNT="$(
            wc -w <<< "$INSTANCE_ID"
          )"

          if [ "$INSTANCE_COUNT" -ne 1 ]; then
            echo "Foram encontradas várias instâncias: $INSTANCE_ID"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "EC2 localizada: $INSTANCE_ID"

      # ========================================================
      # VERIFY SSM
      # ========================================================

      - name: Wait for SSM
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 30); do
            STATUS="$(
              aws ssm describe-instance-information \
                --region "$AWS_REGION" \
                --filters \
                  "Key=InstanceIds,Values=${INSTANCE_ID}" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text
            )"

            if [ "$STATUS" = "Online" ]; then
              echo "EC2 Online no Systems Manager."
              exit 0
            fi

            echo "Tentativa ${attempt}/30: status SSM '${STATUS:-ausente}'"
            sleep 10
          done

          echo "A EC2 não ficou Online no SSM."
          echo "Verifique o Instance Profile e o amazon-ssm-agent."
          exit 1

      # ========================================================
      # VERIFY K3S
      # ========================================================

      - name: Verify K3s with SSM
        id: verify-k3s
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          set -Eeuo pipefail

          jq -n \
            '{
              commands: [
                "set -Eeuo pipefail",
                "sudo systemctl is-active k3s",
                "sudo timeout 20 k3s kubectl get nodes -o wide"
              ]
            }' \
            > /tmp/verify-k3s.json

          COMMAND_ID="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Validar K3s Oficina360" \
              --parameters file:///tmp/verify-k3s.json \
              --timeout-seconds 120 \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Command ID: $COMMAND_ID"

      - name: Wait for K3s Verification
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          COMMAND_ID: ${{ steps.verify-k3s.outputs.command_id }}
        run: |
          set -Eeuo pipefail

          set +e

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          WAIT_RESULT=$?

          set -e

          STATUS="$(
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text
          )"

          echo "Status: $STATUS"

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text

          if [ "$WAIT_RESULT" -ne 0 ] || [ "$STATUS" != "Success" ]; then
            echo ""
            echo "=== Erros ==="

            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' \
              --output text

            exit 1
          fi

      # ========================================================
      # PACKAGE MANIFESTS
      # ========================================================

      - name: Package Kubernetes Manifests
        if: ${{ inputs.action == 'deploy' }}
        run: |
          set -Eeuo pipefail

          if [ ! -d "k8s" ]; then
            echo "Diretório k8s não encontrado."
            exit 1
          fi

          rm -rf /tmp/oficina360-package
          mkdir -p /tmp/oficina360-package

          cp -R k8s /tmp/oficina360-package/k8s

          rm -f \
            /tmp/oficina360-package/k8s/secret.yaml \
            /tmp/oficina360-package/k8s/secrets.yaml

          find /tmp/oficina360-package/k8s \
            -type f \
            -maxdepth 2 \
            -print

          tar \
            -C /tmp/oficina360-package \
            -czf /tmp/oficina360-k8s.tar.gz \
            k8s

          base64 \
            -w 0 \
            /tmp/oficina360-k8s.tar.gz \
            > /tmp/oficina360-k8s.base64

          ARCHIVE_SIZE="$(
            stat -c '%s' /tmp/oficina360-k8s.tar.gz
          )"

          BASE64_SIZE="$(
            stat -c '%s' /tmp/oficina360-k8s.base64
          )"

          echo "Tamanho compactado: ${ARCHIVE_SIZE} bytes"
          echo "Tamanho Base64: ${BASE64_SIZE} bytes"

          if [ ! -s /tmp/oficina360-k8s.base64 ]; then
            echo "O pacote Base64 está vazio."
            exit 1
          fi

          # Evita tentar transportar arquivos grandes pelo SendCommand.
          if [ "$BASE64_SIZE" -gt 200000 ]; then
            echo "O pacote Base64 está muito grande para este fluxo."
            echo "Mantenha somente YAMLs e pequenos scripts na pasta k8s."
            exit 1
          fi

      # ========================================================
      # DEPLOY
      # ========================================================

      - name: Send Kubernetes Manifests
        if: ${{ inputs.action == 'deploy' }}
        id: deploy-command
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -Eeuo pipefail

          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "O Secret DOCKERHUB_USERNAME não foi configurado."
            exit 1
          fi

          MANIFESTS_BASE64="$(
            cat /tmp/oficina360-k8s.base64
          )"

          IMAGE_URI="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}"

          jq -n \
            --arg package "$MANIFESTS_BASE64" \
            --arg image "$IMAGE_URI" \
            --arg namespace "$KUBERNETES_NAMESPACE" \
            '{
              commands: [
                "set -Eeuo pipefail",
                "rm -rf /tmp/oficina360",
                "mkdir -p /tmp/oficina360",
                (
                  "printf '\''%s'\'' '\''"
                  + $package
                  + "'\'' | base64 -d > /tmp/oficina360/k8s.tar.gz"
                ),
                "tar -xzf /tmp/oficina360/k8s.tar.gz -C /tmp/oficina360",
                "rm -f /tmp/oficina360/k8s.tar.gz",
                "test -d /tmp/oficina360/k8s",
                "sudo k3s kubectl apply --filename /tmp/oficina360/k8s/namespace.yaml",
                "sudo k3s kubectl apply --filename /tmp/oficina360/k8s/configmap.yaml",
                "sudo k3s kubectl apply --filename /tmp/oficina360/k8s/postgres-pvc.yaml",
                "sudo k3s kubectl apply --filename /tmp/oficina360/k8s/postgres-service.yaml",
                "sudo k3s kubectl apply --filename /tmp/oficina360/k8s/postgres-deployment.yaml",
                (
                  "sudo k3s kubectl rollout status deployment/postgres"
                  + " --namespace "
                  + $namespace
                  + " --timeout=300s"
                ),
                "sudo k3s kubectl apply --filename /tmp/oficina360/k8s/api-deployment.yaml",
                "sudo k3s kubectl apply --filename /tmp/oficina360/k8s/api-service.yaml",
                (
                  "sudo k3s kubectl set image"
                  + " deployment/oficina360-api"
                  + " oficina360-api="
                  + $image
                  + " --namespace "
                  + $namespace
