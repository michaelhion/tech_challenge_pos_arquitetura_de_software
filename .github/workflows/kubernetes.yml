  name: Kubernetes Deploy with SSM

  on:
    workflow_dispatch:
      inputs:
        action:
          description: "Ação Kubernetes"
          required: true
          default: "deploy"
          type: choice
          options:
            - deploy
            - status
            - remove

        branch:
          description: "Branch do projeto"
          required: true
          default: "main"
          type: string

  permissions:
    contents: read
    id-token: write

  concurrency:
    group: oficina360-kubernetes
    cancel-in-progress: false

  env:
    AWS_REGION: us-east-1
    EC2_INSTANCE_NAME: Oficina360-k3s
    KUBERNETES_NAMESPACE: oficina360
    PROJECT_DIR: /opt/oficina360

  jobs:

    kubernetes:
      name: Kubernetes ${{ inputs.action }}
      runs-on: ubuntu-latest

      environment:
        name: lab

      defaults:
        run:
          shell: bash

      steps:

        # ============================================================
        # CHECKOUT
        # ============================================================

        - name: Checkout
          uses: actions/checkout@v4

        # ============================================================
        # AWS
        # ============================================================

        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
            role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Validate AWS Identity
          run: |
            set -Eeuo pipefail
            
            aws sts get-caller-identity

        # ============================================================
        # EC2
        # ============================================================

        - name: Locate EC2 Instance
          id: ec2
          run: |
            set -Eeuo pipefail
            
            INSTANCE_IDS="$(
              aws ec2 describe-instances \
                --region "$AWS_REGION" \
                --filters \
                  "Name=tag:Name,Values=${EC2_INSTANCE_NAME}" \
                  "Name=instance-state-name,Values=pending,running" \
                --query 'Reservations[].Instances[].InstanceId' \
                --output text
            )"
            
            if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
              echo "Nenhuma EC2 foi encontrada."
              exit 1
            fi
            
            if [ "$(wc -w <<< "$INSTANCE_IDS")" -ne 1 ]; then
              echo "Foi encontrada uma quantidade inesperada de instâncias:"
              echo "$INSTANCE_IDS"
              exit 1
            fi
            
            INSTANCE_ID="$INSTANCE_IDS"
            
            echo "::add-mask::$INSTANCE_ID"
            echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
            
            echo "EC2 localizada: $INSTANCE_ID"

        - name: Wait for EC2 Running
          env:
            INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          run: |
            set -Eeuo pipefail
            
            aws ec2 wait instance-running \
              --region "$AWS_REGION" \
              --instance-ids "$INSTANCE_ID"
            
            echo "EC2 está em execução."

        # ============================================================
        # SSM
        # ============================================================

        - name: Wait for SSM
          env:
            INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          run: |
            set -Eeuo pipefail
            
            for attempt in $(seq 1 30); do
            
              STATUS="$(
                aws ssm describe-instance-information \
                  --region "$AWS_REGION" \
                  --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
                  --query 'InstanceInformationList[0].PingStatus' \
                  --output text \
                  2>/dev/null || true
              )"
            
              if [ "$STATUS" = "Online" ]; then
                echo "EC2 está Online no Systems Manager."
                exit 0
              fi
            
              echo "Tentativa ${attempt}/30: SSM status '${STATUS:-ausente}'"
            
              sleep 10
            done
            
            echo "A EC2 não ficou Online no SSM."
            exit 1

        # ============================================================
        # DEPLOY
        # ============================================================

        - name: Deploy Kubernetes
          if: ${{ inputs.action == 'deploy' }}
          id: deploy
          env:
            INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
            BRANCH: ${{ inputs.branch }}
          run: |
            set -Eeuo pipefail
            
            COMMAND_ID="$(
              aws ssm send-command \
                --region "$AWS_REGION" \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --comment "Deploy Oficina360 Kubernetes" \
                --parameters "commands=[
                  \"set -Eeuo pipefail\",
                  \"cd ${PROJECT_DIR}\",
                  \"echo '=== Atualizando repositório ==='\",
                  \"git fetch origin\",
                  \"git checkout ${BRANCH}\",
                  \"git reset --hard origin/${BRANCH}\",
                  \"echo '=== Commit atual ==='\",
                  \"git rev-parse --short HEAD\",
                  \"echo '=== Verificando manifests ==='\",
                  \"test -d k8s\",
                  \"test -f k8s/namespace.yaml\",
                  \"test -f k8s/configmap.yaml\",
                  \"test -f k8s/postgres-pvc.yaml\",
                  \"test -f k8s/postgres-service.yaml\",
                  \"test -f k8s/postgres-deployment.yaml\",
                  \"test -f k8s/api-deployment.yaml\",
                  \"test -f k8s/api-service.yaml\",
                  \"test -f k8s/hpa.yaml\",
                  \"echo '=== Validando manifests ==='\",
                  \"sudo k3s kubectl apply --dry-run=server -f k8s/\",
                  \"echo '=== Aplicando manifests ==='\",
                  \"sudo k3s kubectl apply -f k8s/\",
                  \"echo '=== Aguardando PostgreSQL ==='\",
                  \"sudo k3s kubectl rollout status deployment/postgres --namespace ${KUBERNETES_NAMESPACE} --timeout=300s\",
                  \"echo '=== Aguardando API ==='\",
                  \"sudo k3s kubectl rollout status deployment/oficina360-api --namespace ${KUBERNETES_NAMESPACE} --timeout=600s\",
                  \"echo '=== Pods ==='\",
                  \"sudo k3s kubectl get pods --namespace ${KUBERNETES_NAMESPACE} -o wide\",
                  \"echo '=== Services ==='\",
                  \"sudo k3s kubectl get services --namespace ${KUBERNETES_NAMESPACE}\",
                  \"echo '=== PVC ==='\",
                  \"sudo k3s kubectl get pvc --namespace ${KUBERNETES_NAMESPACE}\",
                  \"echo '=== HPA ==='\",
                  \"sudo k3s kubectl get hpa --namespace ${KUBERNETES_NAMESPACE}\",
                  \"echo '=== Deploy concluído ==='\"
                ]" \
                --timeout-seconds 1200 \
                --query 'Command.CommandId' \
                --output text
            )"
            
            if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
              echo "O SSM não retornou um Command ID."
              exit 1
            fi
            
            echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
            
            echo "Command ID: $COMMAND_ID"

        - name: Wait for Kubernetes Deployment
          if: ${{ inputs.action == 'deploy' }}
          env:
            INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
            COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          run: |
            set -Eeuo pipefail
            
            echo "Aguardando deploy Kubernetes..."
            
            FINAL_STATUS=""
            
            for attempt in $(seq 1 120); do
            
              STATUS="$(
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'Status' \
                  --output text \
                  2>/dev/null || true
              )"
            
              case "$STATUS" in
            
                Success)
                  FINAL_STATUS="$STATUS"
                  echo "Deploy concluído com sucesso."
                  break
                  ;;
            
                Failed|Cancelled|TimedOut|Cancelling)
                  FINAL_STATUS="$STATUS"
                  echo "Deploy terminou com status: $STATUS"
                  break
                  ;;
            
                Pending|InProgress|Delayed|"")
                  echo "Tentativa ${attempt}/120: ${STATUS:-indisponível}"
                  sleep 10
                  ;;
            
                *)
                  echo "Status desconhecido: '$STATUS'"
                  sleep 10
                  ;;
            
              esac
            
            done
            
            if [ -z "$FINAL_STATUS" ]; then
              FINAL_STATUS="$(
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'Status' \
                  --output text \
                  2>/dev/null || echo "TimedOut"
              )"
            fi
            
            echo ""
            echo "========================================"
            echo "Status final: $FINAL_STATUS"
            echo "========================================"
            
            echo ""
            echo "=== Saída do deploy ==="
            
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardOutputContent' \
              --output text \
              || true
            
            echo ""
            echo "=== Erros do deploy ==="
            
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' \
              --output text \
              || true
            
            if [ "$FINAL_STATUS" != "Success" ]; then
              echo ""
              echo "Deploy Kubernetes falhou."
            
              exit 1
            fi

        # ============================================================
        # STATUS
        # ============================================================

        - name: Kubernetes Status
          if: ${{ inputs.action == 'status' }}
          id: status
          env:
            INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          run: |
            set -Eeuo pipefail
            
            COMMAND_ID="$(
              aws ssm send-command \
                --region "$AWS_REGION" \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --comment "Status Oficina360 Kubernetes" \
                --parameters "commands=[
                  \"set -Eeuo pipefail\",
                  \"echo '=== Node ==='\",
                  \"sudo k3s kubectl get nodes -o wide\",
                  \"echo '=== Pods ==='\",
                  \"sudo k3s kubectl get pods --namespace ${KUBERNETES_NAMESPACE} -o wide\",
                  \"echo '=== Deployments ==='\",
                  \"sudo k3s kubectl get deployments --namespace ${KUBERNETES_NAMESPACE}\",
                  \"echo '=== Services ==='\",
                  \"sudo k3s kubectl get services --namespace ${KUBERNETES_NAMESPACE}\",
                  \"echo '=== Endpoints ==='\",
                  \"sudo k3s kubectl get endpoints --namespace ${KUBERNETES_NAMESPACE}\",
                  \"echo '=== PVC ==='\",
                  \"sudo k3s kubectl get pvc --namespace ${KUBERNETES_NAMESPACE}\",
                  \"echo '=== HPA ==='\",
                  \"sudo k3s kubectl get hpa --namespace ${KUBERNETES_NAMESPACE}\"
                ]" \
                --timeout-seconds 180 \
                --query 'Command.CommandId' \
                --output text
            )"
            
            echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
            
            aws ssm wait command-executed \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"
            
            echo ""
            echo "=== Kubernetes Status ==="
            
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardOutputContent' \
              --output text

        # ============================================================
        # REMOVE
        # ============================================================

        - name: Remove Kubernetes Workloads
          if: ${{ inputs.action == 'remove' }}
          id: remove
          env:
            INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          run: |
            set -Eeuo pipefail
            
            COMMAND_ID="$(
              aws ssm send-command \
                --region "$AWS_REGION" \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --comment "Remove Oficina360 Kubernetes" \
                --parameters "commands=[
                  \"set -Eeuo pipefail\",
                  \"echo '=== Removendo namespace ${KUBERNETES_NAMESPACE} ==='\",
                  \"sudo k3s kubectl delete namespace ${KUBERNETES_NAMESPACE} --ignore-not-found=true\",
                  \"echo '=== Remoção concluída ==='\"
                ]" \
                --timeout-seconds 300 \
                --query 'Command.CommandId' \
                --output text
            )"
            
            echo "Command ID: $COMMAND_ID"
            
            aws ssm wait command-executed \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"
            
            echo ""
            echo "=== Resultado da remoção ==="
            
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{
                Status: Status,
                Output: StandardOutputContent,
                Error: StandardErrorContent
              }'
